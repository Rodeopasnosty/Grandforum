<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="yandex-verification" content="0bab8749f7716287" />
    <title>{{ page.title | default: site.name }}</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        /* ВЕСЬ ВАШ CSS ИЗ ПРЕДЫДУЩЕГО КОДА ОСТАЕТСЯ ЗДЕСЬ БЕЗ ИЗМЕНЕНИЙ */
        :root { --bg-primary: #f8f9fa; --bg-secondary: #ffffff; --bg-glass: rgba(255, 255, 255, 0.75); --border-color: rgba(0, 0, 0, 0.06); --border-glow: rgba(34, 197, 94, 0.15); --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8; --accent: #22c55e; --accent-hover: #16a34a; --accent-glow: rgba(34, 197, 94, 0.3); --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04); --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.05); --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.08); --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px; --blur: blur(20px); --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); --transition-fast: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        [data-theme="dark"] { --bg-primary: #090d16; --bg-secondary: #111827; --bg-glass: rgba(17, 24, 39, 0.8); --border-color: rgba(255, 255, 255, 0.06); --border-glow: rgba(34, 197, 94, 0.25); --text-primary: #f8fafc; --text-secondary: #cbd5e1; --text-muted: #64748b; --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15); --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.3); --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
        html { scroll-behavior: smooth; } body { background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.4s ease, color 0.4s ease; overflow-x: hidden; font-size: 16px; line-height: 1.5; } a { text-decoration: none; color: inherit; } ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: var(--bg-primary); } ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
        .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: var(--transition-fast); border: 1px solid transparent; gap: 8px; } .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 14px var(--accent-glow); } .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); } .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--border-color); } .btn-secondary:hover { background: var(--bg-primary); border-color: var(--text-muted); }
        .header { position: fixed; top: 0; left: 0; width: 100%; background: var(--bg-glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: 1px solid var(--border-color); z-index: 100; } .header-container { display: flex; align-items: center; justify-content: space-between; height: 70px; } .logo-area { display: flex; align-items: center; gap: 8px; } .logo-badge { background: var(--accent); color: white; font-weight: 900; padding: 4px 8px; border-radius: 6px; font-size: 0.95rem; } .logo-text { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; } .nav-links { display: flex; gap: 24px; list-style: none; } .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); transition: var(--transition-fast); } .nav-links a:hover, .nav-links a.active { color: var(--accent); } .header-actions { display: flex; align-items: center; gap: 12px; }
        .footer { background: var(--bg-secondary); border-top: 1px solid var(--border-color); padding: 30px 0; margin-top: 60px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
        .user-profile-nav { display: none; align-items: center; gap: 10px; font-weight: 600; font-size: 0.9rem; } .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo-area">
                <div class="logo-badge">GTA V</div>
                <div class="logo-text"><a href="/">GRAND FORUM</a></div>
            </div>
            <ul class="nav-links">
                <li><a href="/">Главная</a></li>
            </ul>
        </div>
    </header>

    <!-- СЮДА БУДЕТ ВСТАВЛЯТЬСЯ КОНТЕНТ СТРАНИЦ -->
    {{ content }}

    <footer class="footer">
        <div class="container">
            <div>&copy; 2026 GRAND FORUM. Все права защищены.</div>
        </div>
    </footer>
</body>
</html>
