<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="yandex-verification" content="0bab8749f7716287" />
    <title>GRAND FORUM - GTA V Premium Portal</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        :root { --bg-primary: #f8f9fa; --bg-secondary: #ffffff; --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8; --accent: #22c55e; --accent-hover: #16a34a; --border-color: rgba(0, 0, 0, 0.06); }
        [data-theme="dark"] { --bg-primary: #090d16; --bg-secondary: #111827; --text-primary: #f8fafc; --text-secondary: #cbd5e1; --text-muted: #64748b; --border-color: rgba(255, 255, 255, 0.06); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; }
        .btn { padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; background: var(--accent); color: white; }
        .btn:hover { background: var(--accent-hover); }
        .box { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline: none; }
        .form-group textarea { min-height: 100px; }
        .thread-item { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .thread-item a { color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GRAND FORUM</h1>
            <div id="auth-area">
                <button class="btn" onclick="loginAdmin()">Войти как Админ</button>
            </div>
        </header>

        <div id="create-box" class="box" style="display: none;">
            <h3>Создать новую тему</h3>
            <div class="form-group" style="margin-top: 10px;">
                <select id="t-cat"><option>Общие обсуждения</option><option>GTA Online</option></select>
            </div>
            <div class="form-group"><input type="text" id="t-title" placeholder="Заголовок темы"></div>
            <div class="form-group"><textarea id="t-text" placeholder="Текст темы..."></textarea></div>
            <button class="btn" onclick="createThread()">Опубликовать на GitHub</button>
        </div>

        <h2>Лента тем</h2>
        <div id="threads-list" style="margin-top: 15px;">
            <p style="color: var(--text-muted);">Загрузка тем...</p>
        </div>
    </div>

    <script>
        const REPO = "Rodeopasnosty/Grandforum"; // Ваш репозиторий
        const ADMIN_PASS = "gta5creator2026";
        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        function updateAuthUI() {
            if (isAdmin) {
                document.getElementById('auth-area').innerHTML = '<button class="btn" onclick="logout()">Выйти</button>';
                document.getElementById('create-box').style.display = 'block';
            } else {
                document.getElementById('auth-area').innerHTML = '<button class="btn" onclick="loginAdmin()">Войти как Админ</button>';
                document.getElementById('create-box').style.display = 'none';
            }
        }

        function loginAdmin() {
            if (prompt("Введите пароль администратора:") === ADMIN_PASS) {
                localStorage.setItem('isAdmin', 'true');
                isAdmin = true;
                updateAuthUI();
            } else {
                alert("Неверный пароль!");
            }
        }

        function logout() {
            localStorage.setItem('isAdmin', 'false');
            isAdmin = false;
            updateAuthUI();
        }

        updateAuthUI();

        // Загрузка списка тем прямо из репозитория GitHub через API
        async function loadThreads() {
            try {
                let res = await fetch(`https://api.github.com/repos/${REPO}/contents/threads`);
                let files = await res.json();
                let listDiv = document.getElementById('threads-list');
                listDiv.innerHTML = "";

                if (!Array.isArray(files) || files.length === 0) {
                    listDiv.innerHTML = "<p style='color: var(--text-muted);'>Тем пока нет.</p>";
                    return;
                }

                files.forEach(file => {
                    if (file.name.endsWith('.html')) {
                        let title = decodeURIComponent(file.name.replace('.html', '').replace(/-/g, ' '));
                        listDiv.innerHTML += `
                            <div class="thread-item">
                                <div>
                                    <strong>${title}</strong>
                                </div>
                                <a href="threads/${file.name}" target="_blank">Открыть тему →</a>
                            </div>
                        `;
                    }
                });
            } catch (e) {
                document.getElementById('threads-list').innerHTML = "<p style='color: var(--text-muted);'>Ошибка загрузки тем.</p>";
            }
        }

        async function createThread() {
            let title = document.getElementById('t-title').value.trim();
            let text = document.getElementById('t-text').value.trim();
            let cat = document.getElementById('t-cat').value;

            if (!title || !text) { alert("Заполните все поля!"); return; }

            let token = prompt("Введите ваш GitHub Token (ghp_...):");
            if (!token) return;

            let slug = title.toLowerCase().replace(/[^a-z0-9а-яё]/gi, '-').replace(/-+/g, '-');
            let filename = `threads/${slug}.html`;

            let htmlContent = `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
    <meta name="yandex-verification" content="0bab8749f7716287" />
    <style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.6;}h1{margin-bottom:10px;}.meta{color:gray;font-size:0.9rem;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:10px;}</style>
</head>
<body>
    <a href="../index.html">← На главную</a>
    <h1>${title}</h1>
    <div class="meta">Категория: ${cat}</div>
    <div>${text.replace(/\n/g, '<br>')}</div>
</body>
</html>`;

            let encodeBase64 = (str) => btoa(unescape(encodeURIComponent(str)));

            let res = await fetch(`https://api.github.com/repos/${REPO}/contents/${filename}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token.trim()}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Создана тема: ${title}`,
                    content: encodeBase64(htmlContent)
                })
            });

            if (res.ok) {
                alert("✅ Успех! Тема создана как отдельная страница в папке /threads/. Через минуту она появится на сайте.");
                document.getElementById('t-title').value = '';
                document.getElementById('t-text').value = '';
                loadThreads();
            } else {
                alert("Ошибка сохранения. Проверьте токен.");
            }
        }

        loadThreads();
    </script>
</body>
</html>
