---
layout: default
---
<style>
    .hero { padding-top: 140px; padding-bottom: 60px; text-align: center; }
    .hero-title { font-size: 3rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 16px; }
    .hero-title span { color: var(--accent); }
    
    .create-thread-box { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; margin-bottom: 32px; display: none; }
    .form-group { margin-bottom: 12px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline: none; }
    .form-group textarea { min-height: 120px; resize: vertical; }
    
    .threads-list { display: flex; flex-direction: column; gap: 12px; }
    .thread-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .thread-card:hover { border-color: var(--accent); transform: translateX(2px); }
    .badge-new { background: #3b82f6; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; margin-right: 8px;}
    .thread-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
</style>

<section class="hero container">
    <h1 class="hero-title">Персональный блог-форум <span>GTA 5</span></h1>
    <div id="admin-controls" style="margin-top: 20px;">
        <button class="btn btn-secondary" onclick="loginAdmin()">Войти как Админ</button>
    </div>
</section>

<div class="container">
    <div class="create-thread-box" id="create-thread-form">
        <h3 style="margin-bottom: 16px;">Создать новую запись</h3>
        <div class="form-group"><select id="thread-category"><option>Общие обсуждения</option><option>GTA Online</option><option>RolePlay сообщество</option><option>Моды и Скрипты</option></select></div>
        <div class="form-group"><input type="text" id="thread-title" placeholder="Заголовок"></div>
        <div class="form-group"><textarea id="thread-text" placeholder="Текст темы (можно вставлять ссылки)..."></textarea></div>
        <button class="btn btn-primary" onclick="submitNewPost()">Опубликовать</button>
    </div>

    <h2 style="margin-bottom: 20px;">Лента обсуждений</h2>
    <div class="threads-list">
        <!-- МАГИЯ JEKYLL: Автоматически выводит все файлы из папки _posts -->
        {% for post in site.posts %}
        <div class="thread-card" onclick="window.location.href='{{ site.baseurl }}{{ post.url }}'">
            <div>
                <h4 style="font-size: 1.1rem;"><span class="badge-new">Новое</span>{{ post.title }}</h4>
                <div class="thread-meta">Категория: {{ post.category }} • {{ post.date | date: "%d.%m.%Y" }}</div>
            </div>
            <div style="font-size: 0.8rem; color: var(--accent); font-weight:600;">Читать →</div>
        </div>
        {% else %}
        <div style="text-align:center; padding: 40px; color: var(--text-muted);">Записей пока нет. Создайте первую!</div>
        {% endfor %}
    </div>
</div>

<script>
    const SECRET_ADMIN_CODE = "gta5creator2026";
    let isAdminLoggedIn = localStorage.getItem('is_admin_logged_in') === 'true';

    function checkAuth() {
        if (isAdminLoggedIn) {
            document.getElementById('admin-controls').innerHTML = '<button class="btn btn-secondary" onclick="logout()">Выйти</button>';
            document.getElementById('create-thread-form').style.display = 'block';
        } else {
            document.getElementById('admin-controls').innerHTML = '<button class="btn btn-secondary" onclick="loginAdmin()">Войти как Админ</button>';
            document.getElementById('create-thread-form').style.display = 'none';
        }
    }

    function loginAdmin() {
        if (prompt("Пароль:") === SECRET_ADMIN_CODE) {
            localStorage.setItem('is_admin_logged_in', 'true');
            isAdminLoggedIn = true;
            checkAuth();
        } else {
            alert("Неверный пароль.");
        }
    }

    function logout() {
        localStorage.setItem('is_admin_logged_in', 'false');
        isAdminLoggedIn = false;
        checkAuth();
    }

    checkAuth();

    // ОБНОВЛЕННАЯ ФУНКЦИЯ СОЗДАНИЯ ТЕМЫ
    function submitNewPost() {
        const title = document.getElementById('thread-title').value.trim();
        let text = document.getElementById('thread-text').value.trim();
        const category = document.getElementById('thread-category').value;

        if (!title || !text) { alert('Заполните все поля!'); return; }

        const GITHUB_TOKEN = prompt("🔒 Введите ваш секретный ключ GitHub (ghp_...):");
        if (!GITHUB_TOKEN) return;

        // Превращаем ссылки в тексте в кликабельные HTML теги перед сохранением
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        text = text.replace(urlRegex, function(url) {
            return `<a href="${url}" target="_blank">${url}</a>`;
        });
        
        // Заменяем переносы строк на теги <br> для правильного отображения
        text = text.replace(/\n/g, "<br>");

        // Генерируем красивую ссылку из заголовка (транслит)
        const a = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"c","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
        let slug = title.toLowerCase().split('').map(char => a[char] || char).join('').replace(/[^a-z0-9]/gi, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        if (!slug) slug = "post-" + Date.now();

        // Формируем имя файла для папки _posts
        const dateString = new Date().toISOString().split('T')[0];
        const filename = `${dateString}-${slug}.md`;

        // Формируем контент файла в формате Jekyll (Markdown + YAML)
        const fileContent = `---
layout: thread
title: "${title}"
category: "${category}"
---
${text}`;

        const url = `https://api.github.com/repos/Rodeopasnosty/Grandforum/contents/_posts/${filename}`;
        
        // Безопасная кодировка для русского языка
        const encodeBase64 = (str) => btoa(unescape(encodeURIComponent(str)));

        fetch(url, {
            method: "PUT",
            headers: {
                "Authorization": `token ${GITHUB_TOKEN.trim()}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: `Создана новая тема: ${title}`,
                content: encodeBase64(fileContent)
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.content) {
                alert("✅ Успех! Тема сохранена как отдельная страница.\n\n⚠️ ВАЖНО: GitHub потребуется около 1-2 минут, чтобы собрать новую страницу и обновить сайт. Подождите пару минут и обновите эту страницу.");
                document.getElementById('thread-title').value = '';
                document.getElementById('thread-text').value = '';
            } else {
                alert("Ошибка сохранения. Проверьте ключ.");
            }
        })
        .catch(err => alert("Ошибка соединения."));
    }
</script>
